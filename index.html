<!DOCTYPE html>

<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Customize a Carrot</title>
        <link rel="icon" type="image/x-icon" href="images/favicon.ico">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700&family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="index.css">
        <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" defer></script>
        <script src="script.js" defer></script>
    </head>

    <body>
        <header class="site-header">
            <a href="index.html" class="site-title">Customize a Carrot</a>
            <nav class="carrot__nav">
                <a href="about.html" class="carrot__navItem">About</a>
                <a href="https://github.com/raclim/customize-a-carrot" class="carrot__navItem" target="_blank" rel="noopener noreferrer">
                    Github
                </a>
            </nav>
        </header>

        <main class="editor">
            <aside class="asset-panel">
                <h2>Carrots</h2>
                <div class="asset-grid">
                    <button class="asset-button" data-src="images/realistic_carrot.png" title="Realistic Carrot">
                        <img src="images/realistic_carrot.png" alt="Realistic carrot" draggable="true">
                    </button>
                    <button class="asset-button" data-src="images/realistic_carrots.png" title="Realistic Carrots">
                        <img src="images/realistic_carrots.png" alt="Realistic carrots" draggable="true">
                    </button>
                    <button class="asset-button" data-src="images/cartoon_carrot.png" title="Cartoon Carrot">
                        <img src="images/cartoon_carrot.png" alt="Cartoon carrot" draggable="true">
                    </button>
                    <button class="asset-button" data-src="images/cheese.png" title="Cheese">
                        <img src="images/cheese.png" alt="Cheese" draggable="true">
                    </button>
                </div>

                <h2>Background</h2>
                <div class="background-buttons">
                    <button data-background="white">White</button>
                    <button data-background="clouds">Clouds</button>
                    <button data-background="space">Space</button>
                    <button data-background="anime">Anime</button>
                    <button data-background="nyc">NYC</button>
                    <button data-background="none">None</button>
                </div>
            </aside>

            <aside class="controls-panel">
                <h2>Customize</h2>
                <p id="selectionMessage" class="panel-help">Select an object first.</p>

                <div class="control-group">
                    <label for="sizeControl">
                        <h3>Size</h3>
                        <span id="sizeValue">150px</span>
                    </label>
                    <input id="sizeControl" type="range" min="30" max="500" value="150">
                </div>

                <div class="control-group">
                    <label for="rotateControl">
                        <h3>Rotate</h3>
                        <span id="rotateValue">0</span>
                    </label>
                    <input id="rotateControl" type="range" min="-180" max="180" value="0">
                </div>

                <div class="control-group">
                    <h3>Layer</h3>
                    <div class="control-button-row">
                        <button id="bringForwardButton">Forward</button>
                        <button id="sendBackwardButton">Back</button>
                    </div>
                </div>

                <div class="control-group">
                    <button id="deleteButton" class="danger-button">Delete Selected</button>
                </div>

                <div class="control-group">
                    <h3>Text</h3>
                    <input id="textInput" type="text" placeholder="thoughts..." maxlength="60">
                    <button id="addTextButton">Add Text</button>
                </div>
            </aside>

            <section class="canvas-column">
                <div id="carrotGame">
                    <p id="emptyMessage">drag carrots here</p>
                </div>
                <div class="canvas-actions">
                    <button id="resetButton">Reset</button>
                    <button id="downloadCarrot">Download</button>
                </div>
            </section>
        </main>

        <footer>
            <p>Rachel Lim 2026</p>
        </footer>
    </body>
</html>
